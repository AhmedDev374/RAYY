; رَيّ — RAYY ESP32 firmware
; Monitoring + control for a greenhouse node: multi-pot ingest, capability
; declaration, command execution with acknowledgement, and safety limits.
;
; Build:
;   pio run -e esp32dev
;
; The board only reports the components that are actually wired. Enable the
; matching -D flag for each piece of hardware you install, e.g.
;   -D HAS_FAN=1 -D HAS_VALVE=1 -D HAS_WATER_LEVEL=1 -D HAS_FLOW=1
; Everything left disabled is reported to the backend as "not installed", so
; the dashboard shows «يتطلب تركيب الحساس» / «جاهز للتكامل» instead of a value.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  madhephaestus/ESP32Servo        ; needed only when HAS_VENT_SERVO=1

build_flags =
  -D API_BASE_URL=\"http://192.168.1.100:8000\"
  ; --- hardware actually installed on this board (0 = not installed) ---
  -D HAS_PUMP=1
  -D HAS_VALVE=0
  -D HAS_FAN=0
  -D HAS_GROW_LIGHT=0
  -D HAS_VENT_SERVO=0
  -D HAS_DHT=1
  -D HAS_LDR=1
  -D HAS_SOIL=1
  -D HAS_WATER_LEVEL=0
  -D HAS_FLOW=0
